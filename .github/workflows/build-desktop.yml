name: Build desktop binaries

# Builds the Electron app for macOS, Windows, and Linux in parallel and
# uploads the packaged artifacts. Triggers:
#   - Push of a tag matching v* (e.g. v1.0.0)    → release-candidate build
#   - Manual workflow_dispatch                    → ad-hoc build
#   - Pull requests touching desktop-relevant    → smoke build (no upload
#     files                                        to itch, artifacts only)
#
# The actual `butler push` step lives in a separate publish job that only
# runs on tag pushes, so PR builds never accidentally publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"
      - "build/**"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            itch_channel: osx
            artifact_glob: "release/*.{dmg,zip}"
          - os: windows-latest
            itch_channel: windows
            artifact_glob: "release/*.{exe,zip}"
          - os: ubuntu-latest
            itch_channel: linux
            artifact_glob: "release/*.AppImage"

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signing secrets are absent on forked PRs, so the workflow has to
      # work both ways. Resolving it to a single output keeps the build
      # steps below from repeating the same secret test.
      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CSC_LINK }}
          AZURE_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          case "${{ matrix.os }}" in
            macos-*)   [ -n "$MAC_CERT" ] && echo "sign=true" >> "$GITHUB_OUTPUT" || echo "sign=false" >> "$GITHUB_OUTPUT" ;;
            windows-*) [ -n "$AZURE_ID" ] && echo "sign=true" >> "$GITHUB_OUTPUT" || echo "sign=false" >> "$GITHUB_OUTPUT" ;;
            *)         echo "sign=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # @electron/notarize wants a filesystem path to the .p8, not its
      # contents, so the secret has to be materialised before the build.
      # Written outside the workspace so it cannot be picked up by a glob
      # and uploaded as a build artifact.
      - name: Stage App Store Connect API key
        if: startsWith(matrix.os, 'macos') && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$KEY_CONTENT" > "$key_dir/AuthKey.p8"
          chmod 600 "$key_dir/AuthKey.p8"
          echo "APPLE_API_KEY=$key_dir/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build desktop package (signed)
        if: steps.signing.outputs.sign == 'true'
        # Auto-publish is disabled via "publish": null in package.json
        # build config — we push to itch via butler in a later job, not
        # via electron-builder's GH Releases path.
        #
        # No STEAM_APP_ID is set — itch builds must not init steamworks.
        # For Steam builds, trigger this workflow with STEAM_APP_ID set
        # in the environment (via a separate workflow_dispatch input)
        # or switch to the steam-publish workflow.
        #
        # macOS: CSC_LINK/CSC_KEY_PASSWORD let electron-builder import the
        # Developer ID .p12 into a temporary keychain itself. Notarization
        # uses the API-key mode rather than an app-specific password —
        # revocable per-key and not tied to a personal Apple ID.
        #
        # Windows: Azure Trusted Signing credentials reach the Azure SDK
        # through its EnvironmentCredential. The four azureSignOptions
        # fields are injected here rather than committed to package.json
        # so that an unsigned local or PR build stays possible.
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          # No `--` separator: unlike npm, pnpm forwards it literally and
          # electron-builder would receive it as an argument.
          if [ "${{ runner.os }}" = "Windows" ]; then
            pnpm run electron:build \
              -c.win.azureSignOptions.publisherName="${{ vars.AZURE_PUBLISHER_NAME }}" \
              -c.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}" \
              -c.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}" \
              -c.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_CERT_PROFILE }}"
          else
            pnpm run electron:build
          fi

      - name: Build desktop package (unsigned)
        if: steps.signing.outputs.sign != 'true'
        shell: bash
        # mac.identity is pinned in package.json so a release build can
        # never silently fall back to the wrong certificate. That pin also
        # makes an unsigned build fail, which is correct for a release and
        # wrong for a PR smoke test — hence the explicit override.
        run: |
          echo "::notice::No signing credentials for ${{ matrix.os }} — producing an unsigned build."
          if [ "${{ runner.os }}" = "macOS" ]; then
            pnpm run electron:build -c.mac.identity=null -c.mac.notarize=false
          else
            pnpm run electron:build
          fi

      # The build succeeding proves nothing about the signature: both
      # electron-builder signing paths degrade quietly. This step is what
      # actually blocks a broken artifact from reaching the publish job.
      - name: Verify signatures
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        run: pnpm run verify:signing

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raptor-runner-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  publish-itch:
    name: Publish to itch.io
    needs: build
    # Only publish on tag pushes. PR builds and manual dispatches stay
    # as artifacts only — no accidental channel updates.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        # Channel naming matches itch conventions: one channel per OS
        # plus an arch tag where relevant. Version comes from the git
        # tag (v1.2.3 → 1.2.3).
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"

          push() {
            local channel="$1"
            local path="$2"
            if [ -e "$path" ]; then
              echo "::group::butler push $channel"
              ./butler push --userversion "$VERSION" "$path" "$ITCH_USER/$ITCH_GAME:$channel"
              echo "::endgroup::"
            else
              echo "skip $channel — no artifact at $path"
            fi
          }

          # macOS: prefer the zip (itch app unpacks it cleanly); dmg
          # as a fallback download for users who install it manually.
          push osx       "$(ls artifacts/raptor-runner-macos-latest/*.zip 2>/dev/null | head -n1)"
          push osx-dmg   "$(ls artifacts/raptor-runner-macos-latest/*.dmg 2>/dev/null | head -n1)"

          # Windows: portable exe plus nsis installer.
          push windows          "$(ls artifacts/raptor-runner-windows-latest/*.exe 2>/dev/null | grep -v Setup | head -n1)"
          push windows-setup    "$(ls artifacts/raptor-runner-windows-latest/*Setup*.exe 2>/dev/null | head -n1)"

          # Linux: AppImage.
          push linux "$(ls artifacts/raptor-runner-ubuntu-latest/*.AppImage 2>/dev/null | head -n1)"
