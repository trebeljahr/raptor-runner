name: Build desktop binaries

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
      mode:
        description: Signed release artifacts or unsigned smoke check
        type: choice
        options: [signed, smoke]
        default: signed
  pull_request:
    paths:
      - "src/**"
      - "electron/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "scripts/release/**"
      - "scripts/verify-windows-signing.ps1"
      - ".github/workflows/build-desktop.yml"
      - "build/**"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - id: plan
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
          RELEASE_MODE: ${{ inputs.mode || 'smoke' }}
        run: node scripts/release/plan.mjs desktop
      - run: node --test scripts/release/*.test.mjs

  build:
    needs: plan
    name: ${{ matrix.platform }}-${{ matrix.arch }} (${{ needs.plan.outputs.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Check signing configuration
        if: needs.plan.outputs.mode == 'signed'
        env:
          MAC_CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && vars.AZURE_CLIENT_ID || '' }}
        run: node scripts/release/plan.mjs credentials ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Azure signing login
        if: matrix.platform == 'windows' && needs.plan.outputs.mode == 'signed'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ce0c906e-8a84-4877-afd9-cdf103ddaacb
          subscription-id: 4aaef5a5-286b-46a0-b9e4-84622e8fdc4f
      - name: Stage notarization key
        if: matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notarization.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notarization.p8" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          PLATFORM: ${{ matrix.flag }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ needs.plan.outputs.mode }}
          CSC_LINK: ${{ matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed' && secrets.APPLE_API_ISSUER_ID || '' }}
        run: |
          args=("--$PLATFORM" "--$ARCH" "--publish" "never")
          if [ "$MODE" = signed ] && [ "$PLATFORM" = win ]; then
            args+=("-c.forceCodeSigning=true"
              "-c.win.azureSignOptions.publisherName=Ricos Labs LLC"
              "-c.win.azureSignOptions.endpoint=https://weu.codesigning.azure.net/"
              "-c.win.azureSignOptions.codeSigningAccountName=ricoslabs-signing"
              "-c.win.azureSignOptions.certificateProfileName=ricoslabs-public")
          elif [ "$MODE" = signed ] && [ "$PLATFORM" = mac ]; then
            args+=("-c.forceCodeSigning=true")
          elif [ "$PLATFORM" = mac ]; then
            args+=("-c.mac.identity=null" "-c.mac.notarize=false")
          fi
          pnpm run electron:build "${args[@]}"
      - name: Verify Mac bundles and downloadable archives
        if: matrix.platform == 'macos' && needs.plan.outputs.mode == 'signed'
        run: bash scripts/release/verify-macos.sh
      - name: Verify Windows publisher and timestamps
        if: matrix.platform == 'windows' && needs.plan.outputs.mode == 'signed'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
      - name: Collect packages, Steam depots and checksums
        run: node scripts/release/collect.mjs ${{ matrix.platform }} ${{ matrix.arch }} ${{ needs.plan.outputs.mode }}
      - name: Sign build provenance
        if: needs.plan.outputs.mode == 'signed'
        uses: actions/attest@v4
        with:
          subject-path: release/upload/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.mode == 'signed' && 'release' || 'smoke' }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/upload/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove notarization key
        if: always() && matrix.platform == 'macos'
        run: rm -f "$RUNNER_TEMP/notarization.p8"
