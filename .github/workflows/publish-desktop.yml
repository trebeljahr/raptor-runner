name: Publish tested desktop build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful signed Build desktop binaries run containing all platforms
        type: string
        required: true
      destination:
        description: Upload destination
        type: choice
        options: [downloads-draft, itch, steam]
        default: downloads-draft
      steam_branch:
        description: Steam beta branch; empty uploads without setting a build live (default branch uses Steamworks)
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: desktop-publish-${{ inputs.destination }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release-${{ inputs.destination }}
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Download and verify the signed source run
        id: source
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/release/prepare-publish.mjs desktop "$SOURCE_RUN"
      - name: Create a draft download release
        if: inputs.destination == 'downloads-draft'
        run: node scripts/release/publish-desktop.mjs downloads-draft
      - name: Install butler
        if: inputs.destination == 'itch'
        run: |
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --location --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Upload exact downloads to itch
        if: inputs.destination == 'itch'
        env:
          BUTLER_PATH: ${{ runner.temp }}/butler/butler
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: node scripts/release/publish-desktop.mjs itch
      - name: Prepare Steam depots
        if: inputs.destination == 'steam'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
        run: node scripts/release/publish-desktop.mjs steam
      - name: Install SteamCMD runtime
        if: inputs.destination == 'steam'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1
          # SteamCMD looks for its session in ~/Steam even when the binary is elsewhere.
          # Refuse an existing directory instead of replacing another installation.
          if [[ -e "$HOME/Steam" || -L "$HOME/Steam" ]]; then
            echo 'Unexpected existing Steam installation on the hosted runner.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/raptor-steamcmd"
          ln -s "$RUNNER_TEMP/raptor-steamcmd" "$HOME/Steam"
      - name: Upload Steam depots
        if: inputs.destination == 'steam'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: bash scripts/release/upload-steam.sh
      - name: Remove Steam home link
        if: always() && inputs.destination == 'steam'
        run: |
          if [[ -L "$HOME/Steam" && "$(readlink "$HOME/Steam")" == "$RUNNER_TEMP/raptor-steamcmd" ]]; then
            rm "$HOME/Steam"
          fi
