name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, android, ios]
        default: all
      mode:
        description: Signed release or unsigned native compile check
        type: choice
        options: [signed, smoke]
        default: signed
      build_number:
        description: Required for signed builds; unique integer above existing Play and TestFlight builds
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.plan.outputs.build_number }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - id: plan
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/release/plan.mjs mobile
      - run: node --test scripts/release/*.test.mjs
      - run: python3 -m unittest discover -s scripts/release -p '*_test.py'

  android:
    needs: plan
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      ANDROID_KEYSTORE_BASE64: ${{ needs.plan.outputs.mode == 'signed' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ needs.plan.outputs.mode == 'signed' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ needs.plan.outputs.mode == 'signed' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ needs.plan.outputs.mode == 'signed' && secrets.ANDROID_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/release/plan.mjs credentials android
        if: needs.plan.outputs.mode == 'signed'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Stage upload key
        if: needs.plan.outputs.mode == 'signed'
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/raptor-upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/raptor-upload.keystore" >> "$GITHUB_ENV"
      - run: bash scripts/release/build-android.sh
        if: needs.plan.outputs.mode == 'signed'
      - name: Compile debug APK
        if: needs.plan.outputs.mode == 'smoke'
        run: |
          npm run build:mobile
          npx --no-install cap sync android
          cd android
          ./gradlew --no-daemon --max-workers=2 assembleDebug
      - run: node scripts/release/collect.mjs android universal signed
        if: needs.plan.outputs.mode == 'signed'
      - uses: actions/attest@v4
        if: needs.plan.outputs.mode == 'signed'
        with:
          subject-path: release/upload/*
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.mode == 'signed'
        with:
          name: release-android-universal
          path: release/upload/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.mode == 'smoke'
        with:
          name: smoke-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/raptor-upload.keystore"

  ios:
    needs: plan
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Import and validate distribution identity
        if: needs.plan.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/release/ios-signing.sh
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/release/build-ios.sh
        if: needs.plan.outputs.mode == 'signed'
      - name: Compile without signing
        if: needs.plan.outputs.mode == 'smoke'
        run: |
          npm run mobile:version
          npm run build:mobile
          npx --no-install cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - run: node scripts/release/collect.mjs ios arm64 signed
        if: needs.plan.outputs.mode == 'signed'
      - uses: actions/attest@v4
        if: needs.plan.outputs.mode == 'signed'
        with:
          subject-path: release/upload/*
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.mode == 'signed'
        with:
          name: release-ios-arm64
          path: release/upload/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove temporary signing material
        if: always() && needs.plan.outputs.mode == 'signed'
        run: bash scripts/release/ios-signing.sh cleanup
